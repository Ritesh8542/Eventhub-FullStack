# EventHub Nginx — serves the React build, proxies API + uploads to Node.js.
# Install: sudo cp aws/nginx-eventhub.conf /etc/nginx/sites-available/eventhub
#          sudo ln -s /etc/nginx/sites-available/eventhub /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name _;
    root /home/ubuntu/eventhub/frontend/dist;
    index index.html;

    location /api/ { proxy_pass http://127.0.0.1:5000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /uploads/ { proxy_pass http://127.0.0.1:5000; }
    location / { try_files $uri $uri/ /index.html; }
    client_max_body_size 10M;
}
